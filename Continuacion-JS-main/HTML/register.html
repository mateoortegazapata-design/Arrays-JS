<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mundo Gaming</title>
    <link rel="stylesheet" href="../CSS/Login.css">
</head>
<body class="auth-page">

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="../Images/MUNDO.jpg" alt="Logo Mundo Gaming" width="60" height="60">
                <h2>Crea tu Cuenta</h2>
            </div>

            <form action="login.html" method="GET">
                <div class="form-group">
                    <label for="fullname">Nombre Completo:</label>
                    <input type="text" id="fullname" name="fullname" class="form-control" placeholder="Ej. Mateo Ortega" required>
                </div>

                <div class="form-group">
                    <label for="username">Nombre de Usuario:</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Crea tu usuario" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="tu@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar Contraseña:</label>
                    <input type="password" id="confirm-password" name="confirm-password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Registrarse</button>
            </form>

            <p class="auth-footer-text">
                ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </div>
    </main>

</body>
</html>
