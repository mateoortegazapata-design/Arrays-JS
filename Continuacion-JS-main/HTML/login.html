<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mundo Gaming</title>
    <link rel="stylesheet" href="../CSS/Login.css">
</head>
<body class="auth-page">

    <main class="auth-container">
        <div class="auth-card">
           
            <div class="auth-header">
                <img src="../Images/MUNDO.jpg" alt="Logo Mundo Gaming" width="60" height="60">
                <h2>Acceso a la Plataforma</h2>
            </div>

            <form action="Inicio.html" method="GET">
                <div class="form-group">
                    <label for="username">Usuario o Correo Electrónico:</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-secundary">Iniciar Sesión</button>
            </form>

            <p class="auth-footer-text">
                ¿No tienes una cuenta aún? <a href="register.html">Regístrate aquí</a>
            </p>
        </div>
    </main>

</body>
</html>
